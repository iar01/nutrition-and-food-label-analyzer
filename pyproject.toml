[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labellens"
version = "0.1.0"
description = "LabelLens: Nutrition & Food Label Analyzer"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "LabelLens Contributors" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.18",
    "alembic>=1.13.0",
    "qdrant-client>=1.9.0",
    "python-dotenv>=1.0.1",
    "duckdb>=1.0.0",
    "pandera>=0.19.0",
    "pyarrow>=15.0.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "types-requests>=2.31.0",
]

[tool.hatch.build.targets.wheel]
packages = ["packages/labellens"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length violations (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
mypy_path = "packages"

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "duckdb.*",
    "pandera.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["packages", "."]
asyncio_mode = "auto"
markers = [
    "smoke: mark test as smoke test (requires running services like Ollama)",
    "integration: mark test as integration test (requires Docker / DB)",
]
