[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labellens"
version = "0.1.0"
description = "LabelLens: Nutrition & Food Label Analyzer"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "LabelLens Contributors" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.30",
    "greenlet>=3.0.0",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.18",
    "alembic>=1.13.0",
    "qdrant-client>=1.9.0",
    "python-dotenv>=1.0.1",
    "duckdb>=1.0.0",
    "pandera>=0.19.0",
    "pyarrow>=15.0.0",
    "pandas>=2.2.0",
    "sentence-transformers>=6.1.0",
    "fastembed>=0.9.0",
    "open-clip-torch>=3.3.0",
    "pillow>=12.3.0",
    "tqdm>=4.70.1",
    "pyyaml>=6.0.3",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "fastmcp>=4.1.0",
    "langchain-mcp-adapters>=0.3.1",
    "easyocr>=1.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "types-requests>=2.31.0",
]

[tool.hatch.build.targets.wheel]
packages = ["packages/labellens"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length violations (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["W291", "E402", "F401", "UP015", "I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
mypy_path = "packages"

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "duckdb.*",
    "pandera.*",
    "open_clip.*",
    "sentence_transformers.*",
    "fastembed.*",
    "yaml.*",
    "easyocr",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["packages", "."]
asyncio_mode = "auto"
markers = [
    "smoke: mark test as smoke test (requires running services like Ollama)",
    "integration: mark test as integration test (requires Docker / DB)",
]
[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
