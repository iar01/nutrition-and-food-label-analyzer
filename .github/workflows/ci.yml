name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-qa:
    name: Backend Lint, Test & Fast Evals
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: labellens
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d labellens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
          - 6334:6334

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Run Ruff Lint
        run: |
          uv run ruff check .

      - name: Run Ruff Format Check
        run: |
          uv run ruff format --check .

      - name: Run Mypy Type Check
        run: |
          uv run mypy packages

      - name: Run Database Migrations
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: labellens
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: |
          uv run alembic upgrade head

      - name: Run Unit Tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: labellens
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333
        run: |
          uv run pytest -v -m "not smoke"

      - name: Run Formal Evaluation Regression Gate
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: labellens
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333
        run: |
          uv run python -m evals.runner --fast

  frontend-qa:
    name: Frontend Lint, Typecheck & Standalone Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint Next.js
        run: npm run lint

      - name: Typecheck Next.js
        run: npm run typecheck

      - name: Build Next.js Production Standalone
        run: npm run build
